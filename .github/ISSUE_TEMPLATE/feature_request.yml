name: Feature request
description: Suggest a new plugin, skill or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are trying to get done with Claude, and where the plugin falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the plugin or skill should do instead.
